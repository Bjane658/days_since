<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Since - Task Tracker</title>
    <link rel="stylesheet" href="/static/css/neo-tokens-slim.css">
    <style>
        /* Px Grotesk - sipgate brand font (source: sipgate/web-apps) */
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 400;
            font-style: normal;
            src: url("/static/fonts/px-grotesk-regular.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 400;
            font-style: italic;
            src: url("/static/fonts/px-grotesk-italic.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 700;
            font-style: normal;
            src: url("/static/fonts/px-grotesk-bold.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 700;
            font-style: italic;
            src: url("/static/fonts/px-grotesk-bold-italic.woff2") format('woff2');
            font-display: swap;
        }

        :root {
            --font-body: 'PX-Grotesk', 'BlinkMacSystemFont', '-apple-system', 'Trebuchet MS',
                'Helvetica', 'HelveticaNeue', 'Helvetica Neue', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            --font-mono: 'PX-Grotesk-Mono', 'Monaco', 'Lucida Console', 'monospace';
        }



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--neo-color-global-background-primary-moderate-default, #f0f0f0);
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1em;
            color: var(--neo-color-global-content-primary-moderate, #636363);
        }

        .add-task-section {
            background: var(--neo-color-global-surface-section, #ffffff);
            padding: 20px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px var(--neo-color-global-shadow-default, rgba(18, 18, 18, 0.2));
            margin-bottom: 30px;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
        }

        .add-task-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--neo-color-global-border-neutral-soft-default, #e0e0e0);
            border-radius: 0.25rem;
            font-family: var(--font-body);
            font-size: 1rem;
            background: var(--neo-color-global-surface-section, #ffffff);
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            transition: border-color 150ms ease-in-out;
        }

        .add-task-input:focus {
            outline: none;
            border-color: var(--neo-color-global-border-neutral-moderate-default, #757575);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1.25rem;
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            user-select: none;
            transition:
                background-color 150ms ease-in-out,
                color 150ms ease-in-out,
                box-shadow 150ms ease-in-out,
                border-color 150ms ease-in-out;
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 0.1875rem var(--neo-color-global-border-static-focus, #f547cd) inset;
        }

        /* Variant: loud = primary action on intense background */
        .btn-primary {
            background-color: var(--neo-color-global-background-primary-intense-default, #121212);
            color: var(--neo-color-global-content-primary-on-intense, #fcfcfc);
        }

        .btn-primary:hover {
            background-color: var(--neo-color-global-background-primary-intense-hover, #2b2b2b);
        }

        .btn-primary:active {
            background-color: var(--neo-color-global-background-primary-intense-active, #3c3c3c);
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .task-tile {
            background: var(--neo-color-global-surface-section, #ffffff);
            padding: 24px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px var(--neo-color-global-shadow-subtle, rgba(18, 18, 18, 0.04));
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .task-tile:hover {
            box-shadow: 0 8px 12px var(--neo-color-global-shadow-default, rgba(18, 18, 18, 0.2));
        }

        .task-name {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            margin-bottom: 12px;
        }

        .days-since {
            font-size: 3em;
            font-weight: 700;
            /* Tabular numbers: digit widths stay fixed (Neo typography guideline) */
            font-variant-numeric: lining-nums tabular-nums;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            margin-bottom: 8px;
        }

        .days-label {
            font-size: 1em;
            color: var(--neo-color-global-content-primary-moderate, #636363);
            margin-bottom: 16px;
        }

        .cycle-badge {
            display: inline-block;
            font-size: 0.65em;
            font-weight: 700;
            font-variant-numeric: lining-nums tabular-nums;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            background: var(--neo-color-global-background-primary-soft-default, #f0f0f0);
            border-radius: 0.25rem;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .due-label {
            font-size: 0.95em;
            color: var(--neo-color-global-content-primary-moderate, #636363);
            margin-bottom: 16px;
        }

        .due-label.due-today {
            font-weight: 700;
            color: var(--neo-color-global-content-critical-moderate, #d3333a);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .cycle-input {
            flex: 0 0 140px;
        }

        .form-hint {
            font-size: 0.85em;
            color: var(--neo-color-global-content-primary-moderate, #636363);
            margin-top: 6px;
        }

        /* Variant: normal-critical = confirm-style destructive on soft bg */
        .btn-reset {
            flex: 1;
            background-color: var(--neo-color-global-background-success-soft-default, #e1f8ec);
            color: var(--neo-color-global-content-success-intense, #0b3e2a);
        }

        .btn-reset:hover {
            background-color: var(--neo-color-global-background-success-soft-hover, #cef3e0);
        }

        .btn-reset:active {
            background-color: var(--neo-color-global-background-success-soft-active, #b8ecd1);
        }

        .btn-delete {
            background-color: var(--neo-color-global-background-critical-soft-default, #fdeceb);
            color: var(--neo-color-global-content-critical-intense, #602121);
            padding: 0.5rem 0.75rem;
        }

        .btn-delete:hover {
            background-color: var(--neo-color-global-background-critical-soft-hover, #fbd9d7);
        }

        .btn-delete:active {
            background-color: var(--neo-color-global-background-critical-soft-active, #f9c7c5);
        }

        .empty-state {
            text-align: center;
            color: var(--neo-color-global-content-primary-moderate, #636363);
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
        }

        .empty-state p {
            font-size: 1.2em;
        }

        /* Color coding based on days */
        .task-tile.fresh .days-since {
            color: var(--neo-color-global-content-success-moderate, #008353);
        }

        .task-tile.warning .days-since {
            color: var(--neo-color-global-content-warning-moderate, #986f00);
        }

        .task-tile.overdue .days-since {
            color: var(--neo-color-global-content-critical-moderate, #d3333a);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--neo-color-global-surface-overlay, rgba(7, 7, 7, 0.33));
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--neo-color-global-surface-dialog, #ffffff);
            padding: 32px;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px var(--neo-color-global-shadow-default, rgba(18, 18, 18, 0.2));
            max-width: 500px;
            width: 90%;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            margin-bottom: 24px;
        }

        .modal-body {
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 400;
            color: var(--neo-color-global-content-primary-moderate, #636363);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--neo-color-global-border-neutral-soft-default, #e0e0e0);
            border-radius: 0.25rem;
            font-family: var(--font-body);
            font-size: 1rem;
            background: var(--neo-color-global-surface-section, #ffffff);
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
            transition: border-color 150ms ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--neo-color-global-border-neutral-moderate-default, #757575);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background-color: var(--neo-color-global-background-primary-soft-default, #f0f0f0);
            color: var(--neo-color-global-content-primary-intense, #1f1f1f);
        }

        .btn-secondary:hover {
            background-color: var(--neo-color-global-background-primary-soft-hover, #e8e8e8);
        }

        .btn-secondary:active {
            background-color: var(--neo-color-global-background-primary-soft-active, #e1e1e1);
        }
    </style>
</head>
<body class="neo-light">
    <div class="container">
        <header>
            <h1>Days Since</h1>
            <p class="subtitle">Track your household tasks</p>
        </header>

        <div class="add-task-section">
            <form class="add-task-form" onsubmit="addTask(event)">
                <input
                    type="text"
                    class="add-task-input"
                    id="taskNameInput"
                    placeholder="What do you want to track? (e.g., Vacuumed the floor, Cleaned the kitchen)"
                    required
                >
                <input
                    type="number"
                    class="add-task-input cycle-input"
                    id="taskCycleInput"
                    placeholder="Every __ days"
                    min="1"
                    step="1"
                >
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>

        <div id="tasksContainer" class="tasks-grid">
            <!-- TASKS -->
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="editTaskName">Task Name</label>
                    <input type="text" id="editTaskName" class="form-input" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editTaskDate">Last Completed Date</label>
                    <input type="date" id="editTaskDate" class="form-input">
                <div class="form-group">
                    <label class="form-label" for="editTaskCycle">Cycle (days)</label>
                    <input type="number" id="editTaskCycle" class="form-input" placeholder="no cycle" min="1" step="1">
                    <div class="form-hint">How often the task should be done. Leave empty for no cycle.</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveTaskDate()">Save</button>
            </div>
        </div>
    </div>

    <script>
        async function addTask(event) {
            event.preventDefault();

            const input = document.getElementById('taskNameInput');
            const name = input.value.trim();
            const cycleInput = document.getElementById('taskCycleInput');
            const cycleValue = cycleInput.value.trim();
            const cycle = cycleValue ? parseInt(cycleValue, 10) : null;

            if (!name) return;
            if (cycleValue && (!Number.isInteger(cycle) || cycle < 1)) {
                alert('Cycle must be a whole number of days (>= 1)');
                return;
            }

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(cycle ? { name, cycle } : { name })
                });

                if (response.ok) {
                    input.value = '';
                    cycleInput.value = '';
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to add task');
                }
            } catch (error) {
                console.error('Error adding task:', error);
                alert('Failed to add task');
            }
        }

        async function resetTask(taskId, event) {
            event.stopPropagation();

            try {
                const response = await fetch(`/api/tasks/${taskId}/reset`, {
                    method: 'POST'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to reset task');
                }
            } catch (error) {
                console.error('Error resetting task:', error);
                alert('Failed to reset task');
            }
        }

        async function deleteTask(taskId, event) {
            event.stopPropagation();

            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to delete task');
                }
            } catch (error) {
                console.error('Error deleting task:', error);
                alert('Failed to delete task');
            }
        }

        let currentEditingTaskId = null;

        async function openEditModal(taskId) {
            try {
                const response = await fetch(`/api/tasks/${taskId}`);
                if (!response.ok) {
                    alert('Failed to load task');
                    return;
                }

                const task = await response.json();
                currentEditingTaskId = taskId;

                document.getElementById('editTaskName').value = task.name;
                document.getElementById('editTaskDate').value = task.lastReset;
                document.getElementById('editTaskCycle').value = task.cycle || '';
                document.getElementById('editTaskModal').classList.add('show');
            } catch (error) {
                console.error('Error loading task:', error);
                alert('Failed to load task');
            }
        }

        function closeEditModal() {
            document.getElementById('editTaskModal').classList.remove('show');
            currentEditingTaskId = null;
        }

        async function saveTaskDate() {
            if (!currentEditingTaskId) return;

            const newDate = document.getElementById('editTaskDate').value;
            if (!newDate) {
                alert('Please select a date');
                return;
            }

            const cycleInput = document.getElementById('editTaskCycle');
            const cycleValue = cycleInput.value.trim();
            const cycle = cycleValue ? parseInt(cycleValue, 10) : null;
            if (cycleValue && (!Number.isInteger(cycle) || cycle < 1)) {
                alert('Cycle must be a whole number of days (>= 1)');
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${currentEditingTaskId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ lastReset: newDate, cycle: cycle })
                });

                if (response.ok) {
                    closeEditModal();
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to update task');
                }
            } catch (error) {
                console.error('Error updating task:', error);
                alert('Failed to update task');
            }
        }

        // Make the entire tile clickable to open edit modal
        document.addEventListener('DOMContentLoaded', function() {
            const tiles = document.querySelectorAll('.task-tile');
            tiles.forEach(tile => {
                tile.addEventListener('click', function(event) {
                    // Only trigger if clicking the tile itself, not buttons
                    if (event.target === tile || event.target.classList.contains('task-name') ||
                        event.target.classList.contains('days-since') || event.target.classList.contains('days-label')) {
                        const taskId = tile.dataset.taskId;
                        openEditModal(taskId);
                    }
                });
            });

            // Close modal when clicking outside
            document.getElementById('editTaskModal').addEventListener('click', function(event) {
                if (event.target === this) {
                    closeEditModal();
                }
            });
        });
    </script>
</body>
</html>
