<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Since - Task Tracker</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        /* Px Grotesk - sipgate brand font (source: sipgate/web-apps) */
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 400;
            font-style: normal;
            src: url("/static/fonts/px-grotesk-regular.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 400;
            font-style: italic;
            src: url("/static/fonts/px-grotesk-italic.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 700;
            font-style: normal;
            src: url("/static/fonts/px-grotesk-bold.woff2") format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'PX-Grotesk';
            font-weight: 700;
            font-style: italic;
            src: url("/static/fonts/px-grotesk-bold-italic.woff2") format('woff2');
            font-display: swap;
        }

        /* Tabular numbers: digit widths stay fixed */
        .days-since {
            font-variant-numeric: lining-nums tabular-nums;
        }

        /* Tile color coding based on days */
        .task-tile.fresh .days-since {
            color: var(--color-success-content, #008353);
        }

        .task-tile.warning .days-since {
            color: var(--color-warning-content, #986f00);
        }

        .task-tile.overdue .days-since {
            color: var(--color-error-content, #d3333a);
        }
    </style>
</head>
<body class="min-h-screen bg-base-200">
    <div class="container mx-auto max-w-5xl p-4 lg:p-6">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold">Days Since</h1>
            <p class="text-base opacity-60">Track your household tasks</p>
        </header>

        <div class="mb-8 rounded-box bg-base-100 p-4 shadow-md lg:p-5">
            <form class="flex flex-col gap-3 sm:flex-row" onsubmit="addTask(event)">
                <input
                    type="text"
                    class="input input-bordered flex-1"
                    id="taskNameInput"
                    placeholder="What do you want to track? (e.g., Vacuumed the floor, Cleaned the kitchen)"
                    required
                >
                <input
                    type="number"
                    class="input input-bordered w-full sm:w-40 shrink-0"
                    id="taskCycleInput"
                    placeholder="Every __ days"
                    min="1"
                    step="1"
                >
                <button type="submit" class="btn btn-primary shrink-0">Add Task</button>
            </form>
        </div>

        <div id="tasksContainer" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-4">
            <!-- TASKS -->
        </div>
    </div>

    <!-- Edit Task Modal -->
    <dialog id="editTaskModal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="mb-6 text-2xl font-bold">Edit Task</h3>
            <div class="mb-4">
                <label class="label" for="editTaskName"><span class="label-text">Task Name</span></label>
                <input type="text" id="editTaskName" class="input input-bordered w-full" readonly>
            </div>
            <div class="mb-4">
                <label class="label" for="editTaskDate"><span class="label-text">Last Completed Date</span></label>
                <input type="date" id="editTaskDate" class="input input-bordered w-full">
            </div>
            <div class="mb-4">
                <label class="label" for="editTaskCycle"><span class="label-text">Cycle (days)</span></label>
                <input type="number" id="editTaskCycle" class="input input-bordered w-full" placeholder="no cycle" min="1" step="1">
                <div class="label">
                    <span class="label-text-alt">How often the task should be done. Leave empty for no cycle.</span>
                </div>
            </div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
                </form>
                <button class="btn btn-primary" onclick="saveTaskDate()">Save</button>
            </div>
        </div>
    </dialog>

    <script>
        async function addTask(event) {
            event.preventDefault();

            const input = document.getElementById('taskNameInput');
            const name = input.value.trim();
            const cycleInput = document.getElementById('taskCycleInput');
            const cycleValue = cycleInput.value.trim();
            const cycle = cycleValue ? parseInt(cycleValue, 10) : null;

            if (!name) return;
            if (cycleValue && (!Number.isInteger(cycle) || cycle < 1)) {
                alert('Cycle must be a whole number of days (>= 1)');
                return;
            }

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(cycle ? { name, cycle } : { name })
                });

                if (response.ok) {
                    input.value = '';
                    cycleInput.value = '';
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to add task');
                }
            } catch (error) {
                console.error('Error adding task:', error);
                alert('Failed to add task');
            }
        }

        async function resetTask(taskId, event) {
            event.stopPropagation();

            try {
                const response = await fetch(`/api/tasks/${taskId}/reset`, {
                    method: 'POST'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to reset task');
                }
            } catch (error) {
                console.error('Error resetting task:', error);
                alert('Failed to reset task');
            }
        }

        async function deleteTask(taskId, event) {
            event.stopPropagation();

            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to delete task');
                }
            } catch (error) {
                console.error('Error deleting task:', error);
                alert('Failed to delete task');
            }
        }

        let currentEditingTaskId = null;

        const editModal = () => document.getElementById('editTaskModal');

        async function openEditModal(taskId) {
            try {
                const response = await fetch(`/api/tasks/${taskId}`);
                if (!response.ok) {
                    alert('Failed to load task');
                    return;
                }

                const task = await response.json();
                currentEditingTaskId = taskId;

                document.getElementById('editTaskName').value = task.name;
                document.getElementById('editTaskDate').value = task.lastReset;
                document.getElementById('editTaskCycle').value = task.cycle || '';
                editModal().showModal();
            } catch (error) {
                console.error('Error loading task:', error);
                alert('Failed to load task');
            }
        }

        function closeEditModal() {
            editModal().close();
            currentEditingTaskId = null;
        }

        async function saveTaskDate() {
            if (!currentEditingTaskId) return;

            const newDate = document.getElementById('editTaskDate').value;
            if (!newDate) {
                alert('Please select a date');
                return;
            }

            const cycleInput = document.getElementById('editTaskCycle');
            const cycleValue = cycleInput.value.trim();
            const cycle = cycleValue ? parseInt(cycleValue, 10) : null;
            if (cycleValue && (!Number.isInteger(cycle) || cycle < 1)) {
                alert('Cycle must be a whole number of days (>= 1)');
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${currentEditingTaskId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ lastReset: newDate, cycle: cycle })
                });

                if (response.ok) {
                    closeEditModal();
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to update task');
                }
            } catch (error) {
                console.error('Error updating task:', error);
                alert('Failed to update task');
            }
        }

        // Make the entire tile clickable to open edit modal
        document.addEventListener('DOMContentLoaded', function() {
            const tiles = document.querySelectorAll('.task-tile');
            tiles.forEach(tile => {
                tile.addEventListener('click', function(event) {
                    // Only trigger if clicking the tile itself, not buttons
                    if (event.target === tile || event.target.classList.contains('task-name') ||
                        event.target.classList.contains('days-since') ||
                        event.target.classList.contains('days-label') ||
                        event.target.classList.contains('due-label')) {
                        const taskId = tile.dataset.taskId;
                        openEditModal(taskId);
                    }
                });
            });

            // Close modal when clicking the backdrop
            editModal().addEventListener('click', function(event) {
                if (event.target === this) {
                    closeEditModal();
                }
            });
        });
    </script>
</body>
</html>
